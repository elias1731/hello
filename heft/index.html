<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./heft.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🗿Berichtsheft+</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="🗿B.heft+">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased p-4 pb-20">
    <div class="max-w-7xl mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">Berichtsheft+</h1>
            <div class="flex gap-3 items-center">
                <button id="authBtn" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-full transition text-white text-xs px-3 py-1 flex items-center gap-1">
                    <span id="authBtnText">Anmelden</span>
                </button>
                <a href="https://www.online-ausbildungsnachweis.de/blok/report" target="_blank" rel="noopener noreferrer" class="bg-green-500 hover:bg-green-400 p-2 rounded-full transition flex items-center justify-center" title="Berichtsheft bearbeiten">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </a>
                <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-full transition">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </header>

        <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-sm w-full mx-4 shadow-2xl">
                <h2 class="text-lg font-bold text-white mb-4">Anmelden</h2>
                <input type="password" id="passwordInput" placeholder="Passwort eingeben..." class="w-full bg-slate-700 border-none rounded-lg p-3 text-sm text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 outline-none mb-4">
                <div class="flex justify-end gap-2">
                    <button id="cancelLoginBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm">Abbrechen</button>
                    <button id="submitLoginBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium">Anmelden</button>
                </div>
            </div>
        </div>

        <div id="loader" class="text-center py-10 hidden">
            <p class="text-slate-400 animate-pulse">Lade Daten aus BLok...</p>
        </div>

        <div id="daysContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
