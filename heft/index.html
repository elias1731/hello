<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./heft.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Berichtsheft+ 🗿</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Berichtsheft+ 🗿">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="apple-touch-icon" href="./heft.png">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* define custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased p-4 pb-20">
    <div class="max-w-2xl mx-auto">
        <!-- header container -->
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">Berichtsheft+ 🗿</h1>
            <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-full transition">
                <!-- render refresh icon -->
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </header>

        <!-- render loading indicator -->
        <div id="loader" class="text-center py-10 hidden">
            <p class="text-slate-400 animate-pulse">Lade Daten aus BLok...</p>
        </div>

        <!-- render content container -->
        <div id="daysContainer" class="space-y-4"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
