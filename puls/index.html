<body>
    <header>
        <h1 class="rainbow-text">🧡 Puls</h1>
    </header>

    <main>
        <div class="container" id="ui">
            <div class="restore-banner" id="restoreBanner">
                <div>Letzte Session gefunden: <strong id="restoreInfo"></strong></div>
                <div class="restore-actions">
                    <button id="btn-restore" onclick="restoreSession()">Weiterfahren</button>
                    <button id="btn-discard" onclick="discardSession()" style="background:#444">Verwerfen</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div id="heart">🩶</div>
                    <div id="status">Waiting for data</div>
                    <div class="label">Puls</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="speed">0.0</div>
                    <div class="label">km/h</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="distance">0.00</div>
                    <div class="label">km</div>
                </div>
            </div>

            <div class="controls">
                <button id="btn-start" onclick="startTracking()">Start</button>
                <button id="btn-pause" onclick="pauseTracking()" disabled>Pause</button>
                <button id="btn-stop" onclick="stopTracking()" disabled>Stop</button>
            </div>

            <div class="spotify-card" id="spotifyCard">
                <img class="cover" id="spotCover" src="https://repo.heyfordy.dev/assets/spot.png" alt="cover">
                <div class="spotify-meta">
                    <div class="now">Now Playing</div>
                    <div class="track" id="spotTrack">—</div>
                    <div class="artist" id="spotArtist">—</div>
                </div>
                <img class="spotify-logo" src="https://repo.heyfordy.dev/assets/spot.png" alt="spotify">
            </div>

            <div class="live-graph-card" id="liveGraphCard">
                <h3>Live Puls (30s Samples)</h3>
                <canvas id="livePulseGraph" width="600" height="110"></canvas>
            </div>

            <div class="section-title">Letzte Aufzeichnungen</div>
            <div class="history-card" id="historyCard">
                <div class="history-empty" id="historyEmpty">Noch keine Sessions gespeichert.</div>
                <div id="historyList"></div>
            </div>
        </div>
    </main>

    <script>
        // state
        let wakeLock = null;
        let watchId = null;
        let lastCoord = null;
        let totalDistance = 0;
        let currentSpeed = 0;
        let currentHr = 0;
        let trackingState = 'idle'; // idle | running | paused
        let samples = [];           // {t, hr, speed, dist}
        let sessionStart = null;
        let lastSampleAt = 0;
        let sampleTimer = null;

        const STORAGE_CURRENT = 'puls_current_session';
        const STORAGE_HISTORY = 'puls_history';
        const MAX_HISTORY = 12;

        // --- persistence helpers ---
        function saveCurrent() {
            const payload = {
                totalDistance,
                currentSpeed,
                currentHr,
                trackingState,
                samples,
                sessionStart,
                lastUpdate: Date.now()
            };
            try { localStorage.setItem(STORAGE_CURRENT, JSON.stringify(payload)); } catch(e) {}
        }

        function loadCurrent() {
            try {
                const raw = localStorage.getItem(STORAGE_CURRENT);
                return raw ? JSON.parse(raw) : null;
            } catch(e) { return null; }
        }

        function clearCurrent() {
            try { localStorage.removeItem(STORAGE_CURRENT); } catch(e) {}
        }

        function getHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_HISTORY);
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }

        function pushToHistory(session) {
            const hist = getHistory();
            hist.unshift(session);
            if (hist.length > MAX_HISTORY) hist.length = MAX_HISTORY;
            try { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(hist)); } catch(e) {}
        }

        // --- restore on load ---
        function checkRestore() {
            const saved = loadCurrent();
            if (!saved || saved.trackingState === 'idle') return;
            if (saved.totalDistance < 5 && (!saved.samples || saved.samples.length < 1)) {
                clearCurrent();
                return;
            }
            const km = (saved.totalDistance / 1000).toFixed(2);
            const ageMin = Math.round((Date.now() - (saved.lastUpdate || 0)) / 60000);
            document.getElementById('restoreInfo').textContent =
                `${km} km · ${saved.samples?.length || 0} Samples · vor ${ageMin} min`;
            document.getElementById('restoreBanner').style.display = 'block';
        }

        function restoreSession() {
            const saved = loadCurrent();
            if (!saved) return;
            totalDistance = saved.totalDistance || 0;
            currentSpeed = saved.currentSpeed || 0;
            currentHr = saved.currentHr || 0;
            samples = saved.samples || [];
            sessionStart = saved.sessionStart || Date.now();
            trackingState = 'paused';
            document.getElementById('distance').innerText = (totalDistance / 1000).toFixed(2);
            document.getElementById('speed').innerText = currentSpeed.toFixed(1);
            document.getElementById('restoreBanner').style.display = 'none';
            updateButtons();
            drawLiveGraph();
            saveCurrent();
        }

        function discardSession() {
            clearCurrent();
            totalDistance = 0;
            samples = [];
            sessionStart = null;
            trackingState = 'idle';
            document.getElementById('distance').innerText = '0.00';
            document.getElementById('speed').innerText = '0.0';
            document.getElementById('restoreBanner').style.display = 'none';
            updateButtons();
            drawLiveGraph();
        }

        // --- heart rate ---
        async function updateHr() {
            try {
                const res = await fetch('https://api.heyfordy.dev/puls-elias/live');
                const data = await res.json();
                const ui = document.getElementById('ui');
                const heart = document.getElementById('heart');
                const status = document.getElementById('status');

                if (data.connected) {
                    ui.classList.add('connected');
                    heart.innerText = '❤️';
                    currentHr = data.heartRate || 0;
                    status.innerText = currentHr + ' BPM';
                    const spd = (60 / Math.max(currentHr, 40)) + 's';
                    heart.style.setProperty('--pulse-speed', spd);
                } else {
                    ui.classList.remove('connected');
                    heart.innerText = '🩶';
                    status.innerText = 'Waiting for data';
                    currentHr = 0;
                }
                if (trackingState === 'running' || trackingState === 'paused') saveCurrent();
            } catch(e) {
                console.error('HR fetch failed', e);
            }
        }

        // --- spotify ---
        async function updateSpotify() {
            try {
                const res = await fetch('https://api.heyfordy.dev/radio');
                const data = await res.json();
                const spot = data.spotify;
                if (!spot) return;
                document.getElementById('spotTrack').textContent = spot.track || '—';
                document.getElementById('spotArtist').textContent = spot.artist || '—';
                const cover = document.getElementById('spotCover');
                if (spot.cover) cover.src = spot.cover;
                else cover.src = spot.logo || 'https://repo.heyfordy.dev/assets/spot.png';
            } catch(e) {
                console.error('Spotify fetch failed', e);
            }
        }

        // --- wake lock ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(err) {}
            }
        }
        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
        });

        // --- distance ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function updateButtons() {
            document.getElementById('btn-start').disabled = trackingState === 'running';
            document.getElementById('btn-pause').disabled = trackingState !== 'running';
            document.getElementById('btn-stop').disabled = trackingState === 'idle';
        }

        // sample every 30s while running
        function takeSample() {
            if (trackingState !== 'running') return;
            const now = Date.now();
            samples.push({
                t: now,
                hr: currentHr,
                speed: currentSpeed,
                dist: totalDistance
            });
            lastSampleAt = now;
            drawLiveGraph();
            saveCurrent();
        }

        function startSampleTimer() {
            stopSampleTimer();
            sampleTimer = setInterval(takeSample, 30000);
            if (samples.length === 0) takeSample();
        }
        function stopSampleTimer() {
            if (sampleTimer) { clearInterval(sampleTimer); sampleTimer = null; }
        }

        // tracking controls
        async function startTracking() {
            if (trackingState === 'idle') {
                totalDistance = 0;
                samples = [];
                sessionStart = Date.now();
                lastSampleAt = 0;
                document.getElementById('distance').innerText = '0.00';
                document.getElementById('restoreBanner').style.display = 'none';
            }
            trackingState = 'running';
            updateButtons();
            await requestWakeLock();
            lastCoord = null;
            startSampleTimer();

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(position => {
                    if (trackingState !== 'running') return;
                    const speedMps = position.coords.speed || 0;
                    currentSpeed = speedMps * 3.6;
                    document.getElementById('speed').innerText = currentSpeed.toFixed(1);

                    if (lastCoord) {
                        const d = getDistance(lastCoord.latitude, lastCoord.longitude, position.coords.latitude, position.coords.longitude);
                        if (position.coords.accuracy < 30) totalDistance += d;
                    }
                    lastCoord = { latitude: position.coords.latitude, longitude: position.coords.longitude };
                    document.getElementById('distance').innerText = (totalDistance / 1000).toFixed(2);
                    saveCurrent();
                }, err => console.error(err), { enableHighAccuracy: true, maximumAge: 2000 });
            }
            saveCurrent();
        }

        function pauseTracking() {
            trackingState = 'paused';
            updateButtons();
            releaseWakeLock();
            stopSampleTimer();
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            lastCoord = null;
            document.getElementById('speed').innerText = '0.0';
            currentSpeed = 0;
            saveCurrent();
        }

        function stopTracking() {
            if (samples.length > 0 || totalDistance > 10) {
                const end = Date.now();
                const durationMs = end - (sessionStart || end);
                const hrs = samples.map(s => s.hr).filter(h => h > 0);
                const avgHr = hrs.length ? Math.round(hrs.reduce((a,b)=>a+b,0) / hrs.length) : 0;
                const maxHr = hrs.length ? Math.max(...hrs) : 0;
                pushToHistory({
                    id: end,
                    start: sessionStart,
                    end,
                    durationMs,
                    totalDistance,
                    avgHr,
                    maxHr,
                    samples: samples.slice()
                });
                renderHistory();
            }
            trackingState = 'idle';
            updateButtons();
            releaseWakeLock();
            stopSampleTimer();
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            lastCoord = null;
            currentSpeed = 0;
            document.getElementById('speed').innerText = '0.0';
            clearCurrent();
            samples = [];
            sessionStart = null;
            drawLiveGraph();
        }

        // --- graphs ---
        function drawLineChart(canvas, values, color) {
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth || canvas.width;
            const h = canvas.clientHeight || canvas.height;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, w, h);

            if (!values || values.length < 2) {
                ctx.fillStyle = '#555';
                ctx.font = '12px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('noch zu wenig Daten', w / 2, h / 2 + 4);
                return;
            }

            const min = Math.min(...values) * 0.95;
            const max = Math.max(...values) * 1.05 || 1;
            const range = max - min || 1;
            const padX = 6, padY = 8;
            const usableW = w - padX * 2;
            const usableH = h - padY * 2;

            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                const y = padY + (usableH / 2) * i;
                ctx.beginPath(); ctx.moveTo(padX, y); ctx.lineTo(w - padX, y); ctx.stroke();
            }

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            values.forEach((v, i) => {
                const x = padX + (i / (values.length - 1)) * usableW;
                const y = padY + usableH - ((v - min) / range) * usableH;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            const lastX = padX + usableW;
            ctx.lineTo(lastX, h - padY);
            ctx.lineTo(padX, h - padY);
            ctx.closePath();
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, color + '44');
            grad.addColorStop(1, color + '00');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function drawLiveGraph() {
            const canvas = document.getElementById('livePulseGraph');
            const hrs = samples.map(s => s.hr).filter(h => h > 0);
            drawLineChart(canvas, hrs, '#ff5252');
        }

        function renderHistory() {
            const hist = getHistory();
            const list = document.getElementById('historyList');
            const empty = document.getElementById('historyEmpty');
            list.innerHTML = '';
            if (!hist.length) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            hist.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = 'session-item';
                const date = new Date(s.start || s.end);
                const dateStr = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
                const km = (s.totalDistance / 1000).toFixed(2);
                const mins = Math.round((s.durationMs || 0) / 60000);
                const hrs = (s.samples || []).map(x => x.hr).filter(h => h > 0);

                item.innerHTML = `
                    <div class="session-head">
                        <span class="session-date">${dateStr}</span>
                        <span class="session-stats">
                            <span>${km} km</span>
                            <span>${mins} min</span>
                            <span>⌀ ${s.avgHr || '–'} bpm</span>
                        </span>
                    </div>
                    <div class="graph-wrap"><canvas id="histGraph${idx}"></canvas></div>
                `;
                list.appendChild(item);
                requestAnimationFrame(() => {
                    const c = document.getElementById('histGraph' + idx);
                    drawLineChart(c, hrs, '#ff9a2e');
                });
            });
        }

        // boot
        checkRestore();
        renderHistory();
        drawLiveGraph();
        setInterval(updateHr, 4000);
        updateHr();
        setInterval(updateSpotify, 15000);
        updateSpotify();

        window.addEventListener('pagehide', saveCurrent);
        window.addEventListener('beforeunload', saveCurrent);
    </script>
</body>
</html>
